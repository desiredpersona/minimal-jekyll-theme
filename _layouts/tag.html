---
layout: default
---

{% comment %} List All Post Tags {% endcomment %}
<div class="listing-layout">
  <div class="listing-container">
    <h1 class="listing-header">Tags</h1>
    {% for tag in site.tags %}
    <article class="listing-item">
      <a href="{{ "/tag/" | absolute_url }}{{ tag[0] | slugify }}/">
        <h3 class="listing-item__title">{{ tag | first }} <span class="listing-count">&#40;{{ tag[1].size }}&#41;</span></h3>
      </a>
    </article>
    {% endfor %}
  </div>
</div>
